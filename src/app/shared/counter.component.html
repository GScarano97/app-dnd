<div class="resource-row">
  <b>{{ label }}</b>
  <div class="controls">
    <button
      type="button"
      (click)="change(value - 1)"
      [attr.aria-label]="'Riduci ' + label"
    >
      −</button
    ><input
      type="number"
      min="0"
      step="1"
      [ngModel]="value"
      (ngModelChange)="change($event)"
      [attr.aria-label]="label"
    /><button
      type="button"
      (click)="change(value + 1)"
      [attr.aria-label]="'Aumenta ' + label"
    >
      +
    </button>
  </div>
</div>
