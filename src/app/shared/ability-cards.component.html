<div class="ability-grid">
  @for (name of names; track $index; let i = $index) {
    <div class="ability">
      <strong>{{ name.toUpperCase() }}</strong>
      <div class="mod">{{ c.modifier(c.state.abilities[i].score) }}</div>
      <input
        type="number"
        min="1"
        max="30"
        [(ngModel)]="c.state.abilities[i].score"
        (ngModelChange)="c.save()"
        [attr.aria-label]="'Punteggio ' + name"
        placeholder="—"
      /><small>PUNTEGGIO</small>
    </div>
  }
</div>
