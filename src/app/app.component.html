<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">✧</span>
      <div>
        <b>REGISTRO<br />ARCANO</b><small>IL TUO COMPAGNO DI AVVENTURA</small>
      </div>
    </div>
    <div class="side-label">LA TUA SCHEDA</div>
    <nav>
      @for (n of nav; track n[0]) {
        <button
          class="nav"
          [class.active]="page === n[0]"
          (click)="select(n[0])"
          [attr.aria-label]="n[2]"
          [attr.aria-current]="page === n[0] ? 'page' : null"
        >
          <span class="nav-symbol" aria-hidden="true">{{ n[1] }}</span> <span class="nav-label">{{ n[2] }}</span><span class="nav-short" aria-hidden="true">{{ shortLabels[n[0]] }}</span>
        </button>
      }
    </nav>
    <div class="side-bottom">
      <div class="sigil">✧</div>
      <p>Ogni leggenda<br />inizia da qui.</p>
      <small>LA TUA STORIA TI ASPETTA</small>
    </div>
  </aside>
  <main>
    <header class="top">
      <div class="crumb">
        REGISTRO ARCANO <span> / </span> <strong>{{ pageName }}</strong>
      </div>
      <details class="mobile-tools"><summary aria-label="Apri opzioni della scheda">Opzioni <span aria-hidden="true">⌄</span></summary><div class="mobile-tools-menu"><button type="button" (click)="c.export()">Esporta JSON</button><label>Importa JSON<input type="file" accept="application/json,.json" hidden (change)="importFile($event)"></label><button type="button" (click)="print()">Stampa</button><button type="button" (click)="reset()">Ripristina scheda</button></div></details>
      <div class="top-actions">
        <span class="saved"><i></i> Salvato in questo browser</span
        ><button class="icon-btn" (click)="c.export()">Esporta JSON</button
        ><label class="icon-btn import"
          >Importa
          <input
            type="file"
            accept="application/json,.json"
            hidden
            (change)="importFile($event)" /></label
        ><button class="icon-btn" (click)="print()">Stampa</button
        ><button class="icon-btn" (click)="reset()">Ripristina</button>
      </div>
    </header>
    <app-pwa-status />
    <div id="content">
      <div [class.page-hidden]="page !== 'overview'"><app-overview /></div>
      <div [class.page-hidden]="page !== 'abilities'"><app-abilities /></div>
      <div [class.page-hidden]="page !== 'magic'"><app-magic /></div>
      <div [class.page-hidden]="page !== 'inventory'"><app-inventory /></div>
      <div class="catalog-page" [class.page-hidden]="page !== 'catalog'">
        <app-catalog [active]="page === 'catalog'" />
      </div>
      <div [class.page-hidden]="page !== 'notes'"><app-notes /></div>
    </div>
    <footer>
      ✦ &nbsp; IL TUO REGISTRO, LA TUA STORIA
      <span>CREATO PER LE TUE AVVENTURE</span>
    </footer>
  </main>
</div>
